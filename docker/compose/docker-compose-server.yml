services:
  mysql:
    image: ${MYSQL_IMAGE}
    pull_policy: if_not_present
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MYSQL_DATABASE: "agent-builder"
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_0900_ai_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agent-net

  redis:
    image: ${REDIS_IMAGE}
    pull_policy: if_not_present
    restart: always
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  minio:
    image: ${MINIO_IMAGE}
    pull_policy: if_not_present
    restart: always
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${OBS_AK}
      MINIO_ROOT_PASSWORD: ${OBS_SK}
      MINIO_DOMAIN: minio
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      agent-net:
        ipv4_address: 172.28.0.10
        aliases:
          - agent-builder.minio
          - agent-builder-files-staging.minio

  minio-init:
    image: ${MINIO_MC_IMAGE}
    pull_policy: if_not_present
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${OBS_AK} ${OBS_SK};
      mc mb --ignore-existing local/${OBS_BUCKET};
      echo 'MinIO bucket created';
      "
    networks:
      - agent-net

  studio-console:
    image: ${STUDIO_CONSOLE_IMAGE}
    pull_policy: always
    privileged: true
    restart: always
    cpus: 0.5
    mem_limit: 512m
    volumes:
      - ./config/nginx-docker.conf:/home/conf/nginx.conf
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      - studio-manager
      - studio-service
      - studio-runtime
    networks:
      - agent-net

  studio-manager:
    image: ${STUDIO_MANAGER_IMAGE}
    pull_policy: always
    restart: always
    privileged: true
    cpus: 2
    mem_limit: 4g
    ports:
      - "${MANAGER_PORT:-31111}:31111"
    environment:
      spring_datasource_url: ${SPRING_DATASOURCE_URL}
      spring_datasource_username: ${SPRING_DATASOURCE_USERNAME}
      spring_datasource_password: ${SPRING_DATASOURCE_PASSWORD}
      redis_host: ${REDIS_HOST}
      redis_password: ${REDIS_PASSWORD:-}
      redis_port: ${REDIS_PORT}
      obs_url: ${OBS_URL}
      obs_bucket: ${OBS_BUCKET}
      obs_ak: ${OBS_AK}
      obs_sk: ${OBS_SK}
      server_ssl_enabled: ${SERVER_SSL_ENABLED:-false}
      CB_CF_SERVER_KEYSTORE: ${CB_CF_SERVER_KEYSTORE:-}
      CB_CF_TRUST_KEYSTORE: ${CB_CF_TRUST_KEYSTORE:-}
      server_ssl_trust_store_password: ${SERVER_SSL_TRUST_STORE_PASSWORD:-}
      server_ssl_key_store_password: ${SERVER_SSL_KEY_STORE_PASSWORD:-}
      server_ssl_key_password: ${SERVER_SSL_KEY_PASSWORD:-}
      agent_runtime_endpoint: ${AGENT_RUNTIME_ENDPOINT}
      user_auth_endpoint: ${USER_AUTH_ENDPOINT}
      front_page_block_nodes: Sql,DataQuery,ParamExtraction,ComplexIntentDetection,Agent,StreamTransform
      share_knowledge_enabled: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-net

  studio-service:
    image: ${STUDIO_SERVICE_IMAGE}
    pull_policy: always
    restart: always
    privileged: true
    cpus: 2
    mem_limit: 4g
    ports:
      - "${SERVICE_PORT:-31113}:31113"
    environment:
      spring_datasource_url: ${SPRING_DATASOURCE_URL}
      spring_datasource_username: ${SPRING_DATASOURCE_USERNAME}
      spring_datasource_password: ${SPRING_DATASOURCE_PASSWORD}
      redis_host: ${REDIS_HOST}
      redis_password: ${REDIS_PASSWORD:-}
      redis_port: ${REDIS_PORT}
      obs_url: ${OBS_URL}
      obs_bucket: ${OBS_BUCKET}
      obs_ak: ${OBS_AK}
      obs_sk: ${OBS_SK}
      server_ssl_enabled: ${SERVER_SSL_ENABLED:-false}
      CB_CF_SERVER_KEYSTORE: ${CB_CF_SERVER_KEYSTORE:-}
      CB_CF_TRUST_KEYSTORE: ${CB_CF_TRUST_KEYSTORE:-}
      server_ssl_trust_store_password: ${SERVER_SSL_TRUST_STORE_PASSWORD:-}
      server_ssl_key_store_password: ${SERVER_SSL_KEY_STORE_PASSWORD:-}
      server_ssl_key_password: ${SERVER_SSL_KEY_PASSWORD:-}
      user_auth_endpoint: ${USER_AUTH_ENDPOINT}
      agent_manager_endpoint: ${AGENT_MANAGER_ENDPOINT}
      agent_base_runtime_endpoint: ${AGENT_BASE_RUNTIME_ENDPOINT:-http://agent-base:8008}
      jiuwen_base_url: ${JIUWEN_BASE_URL:-http://studio-runtime:31014}
      koosearch_endpoint:
      model_manager_endpoint:
      model_url:
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-net

  studio-runtime:
    image: ${STUDIO_RUNTIME_IMAGE}
    pull_policy: always
    restart: always
    privileged: true
    cpus: 2
    mem_limit: 4g
    ports:
      - "${RUNTIME_PORT:-31014}:31014"
    environment:
      PORT: 31014
      MODEL_ROUTER_API: http://studio-service:31113/v1/agent-builder
      HTTPS: ${SERVER_SSL_ENABLED:-false}
      HTTPS_CERT_FILE: ${HTTPS_CERT_FILE:-}
      HTTPS_KEY_FILE: ${HTTPS_KEY_FILE:-}
      TLS_CERT_KEY_PASSWD: ${TLS_CERT_KEY_PASSWD:-}
      TLS_CERT_KEY_PATH: /opt/cloud/agent-runtime/tls/key.pem
      TLS_CERT_PATH: /opt/cloud/agent-runtime/tls/cert.pem
      DATASOURCE_OBS_SERVER: ${OBS_URL}
      DATASOURCE_OBS_BUCKET: ${OBS_BUCKET}
      DATASOURCE_OBS_AK: ${OBS_AK}
      DATASOURCE_OBS_SK: ${OBS_SK}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: ${REDIS_PORT}
      JIUWEN_LOG_FILE: /opt/cloud/logs/tgf_python.log
      JIUWEN_LOG_PATH: /opt/cloud/logs/jiuwen.log
      JIUWEN_LOGGING_LOG_FILE: /opt/cloud/logs/jiuwen_python.log
      LOGGING_LOG_PATH: /opt/cloud/logs/
      TGF_LOG_DIR: /opt/cloud/logs/
      PLUGIN_SSL_API_CERT: false
      WORKFLOW_EXECUTE_TIMEOUT: 900
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - agent-net

volumes:
  mysql_data:
  minio_data:

networks:
  agent-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
