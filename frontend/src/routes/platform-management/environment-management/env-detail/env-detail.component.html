<div class="com-drawer-title" style="font-size: 16px; font-weight: bold; margin-bottom: 24px">
  <span>{{ 'env_detail' | i18nextEager }}</span>
</div>

<div id="env-detail" class="com-drawer-content">
  <nz-descriptions [nzColumn]="1" nzLayout="vertical" [nzColon]="false">
    <nz-descriptions-item [nzTitle]="'env_name' | i18nextEager">
      {{ data?.name }}
    </nz-descriptions-item>

    <nz-descriptions-item [nzTitle]="'env_description' | i18nextEager">
      {{ data?.description || '--' }}
    </nz-descriptions-item>

    <nz-descriptions-item [nzTitle]="'status' | i18nextEager">
      <nz-tag *ngIf="data?.status" [nzColor]="getNzTagColor(environmentStatusMap.get(data.status)?.type)">
        {{ environmentStatusMap.get(data.status)?.text | i18nextEager }}
      </nz-tag>
    </nz-descriptions-item>

    <nz-descriptions-item [nzTitle]="'env_resource_vpc_subnet' | i18nextEager">
      <div style="display: flex; align-items: center">
        <div>
          <span>{{ data?.vpcName }}</span>
          <span style="margin: 0 4px">/</span>
          <span>{{ data?.subnetCidr }}</span>
        </div>
        <span nz-typography nzCopyable [nzCopyText]="data?.subnetCidr" class="copy-vpc" style="margin-left: 8px"></span>
      </div>
    </nz-descriptions-item>

    <nz-descriptions-item [nzTitle]="'update_time' | i18nextEager">
      {{ formatTime(data?.updatedOn) }}
    </nz-descriptions-item>
  </nz-descriptions>
</div>

<div class="drawer-footer"></div>
