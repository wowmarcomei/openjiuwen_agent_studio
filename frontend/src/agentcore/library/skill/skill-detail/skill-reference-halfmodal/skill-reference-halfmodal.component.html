<div class="com-drawer-title">
  {{ 'skill.detail.reference.title' | i18n }}
</div>

<div class="com-drawer-content">
  <div style="max-height: calc(100vh - 160px)">
    <nz-table nzShowSizeChanger [nzData]="ListData" [nzFrontPagination]="false">
      <thead>
        <tr>
          <th>{{ title[0] }}</th>
          <th>{{ title[1] }}</th>
        </tr>
      </thead>
      <tbody>
        @for (data of ListData; track data) {
          <tr>
            <td>
              <a nz-button nzType="link" (click)="linkto(data)">{{ data.app_name }} </a>
            </td>
            <td>{{ data.app_version }}</td>
          </tr>
        }
      </tbody>
    </nz-table>
  </div>
  @if (ListData.length) {
    <nz-pagination
      [(nzPageIndex)]="pageIndex"
      [nzTotal]="total"
      [(nzPageSize)]="pageSize"
      [nzPageSizeOptions]="cardPageSizeoptions"
      nzAlign="end"
      [nzShowSizeChanger]="true"
      [nzHideOnSinglePage]="true"
      (nzPageIndexChange)="onQueryParamsChange()"
      (nzPageSizeChange)="onQueryParamsChange()"
    />
  }
</div>

<div class="com-drawer-footer">
  <button nz-button nzType="default" (click)="dismiss()">{{ 'cancel' | i18nextEager }}</button>
  <button nz-button nzType="primary" class="ml-[8px]" (click)="close()">
    {{ 'ok' | i18nextEager }}
  </button>
</div>
