      description: 检索知识库，命中测试
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
          maxLength: 64
          minLength: 1
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 项目空间id
          pattern: ^[a-zA-Z0-9_()\-]+$
          maxLength: 64
          minLength: 1
        - in: body
          name: SearchKnowledgeRepoRequestBody
          description: 知识库检索请求体
          required: true
          schema:
            $ref: '#/definitions/SearchKnowledgeRepoRequestBody'
        - name: offset
          in: query
          required: false
          description: 分页记录的起始位置偏移量，默认值0
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
        - name: limit
          in: query
          required: false
          description: 每一页的数量，默认值10
          type: integer
          format: int32
          default: 10
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: 知识库检索响应体
          schema:
            $ref: '#/definitions/SearchKnowledgeRepoResponseBody'
        '400':
          description: Bad Request 请求错误
