          type: integer
          format: int32
          default: 0
          minimum: 0
          maximum: 10000
        - name: share_scope
          in: query
          required: false
          description: 知识库可见范围
          type: string
          enum:
            - SELF
            - GLOBAL
            - ALL
        - name: limit
          in: query
          required: false
          description: 每一页的数量,默认10
          type: integer
          format: int32
          default: 10
          minimum: 1
          maximum: 1000
        - name: share_scope
          in: query
          required: false
          description: |-
            知识库可见范围
            - SELF：当前空间下可见。
            - GLOBAL：当前租户下共享。
            - ALL：包含当前空间下可见与当前租户下共享。
            - PARTIAL: 部分空间可见
          type: string
          enum:
            - SELF
            - GLOBAL
            - ALL
            - PARTIAL
        - name: name
          in: query
          required: false
          description: 知识库名称
          type: string
          minLength: 0
          maxLength: 192
          pattern: '^.{0,64}$'
        - name: type
          in: query
          required: false
          description: 知识库类型，internal-默认，external-第三方知识库
          type: string
          enum:
            - internal
            - external
        - name: knowledge_base_connection_id
          in: query
          required: false
          description: 接入知识库的连接ID，只有查询第三方知识库时生效
          type: string
          minLength: 0
          maxLength: 100
        - name: status
          in: query
          required: false
          description: 启停状态，OPEN-启用，CLOSE-停用
          type: string
          enum:
            - OPEN
            - CLOSE
        - name: knowledge_base_ids
          in: query
          required: false
          description: 知识库id列表
          type: array
          items:
            type: string
            maxLength: 128
          minItems: 1
          maxItems: 100
        - name: share_type
          in: query
          required: false
          description: 分享状态，my_shared-我共享的，other_shared-他人共享
          type: string
          enum:
            - my_shared
            - other_shared
        - name: knowledge_base_type
          in: query
          required: false
          description: CUSTOM场景适用，知识库类型，1-个人知识库，2-企业知识库
          type: integer
          default: 1
      responses:
        '200':
