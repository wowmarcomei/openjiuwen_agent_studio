          - naive：通用
          - qa：问答
          - table：表格
          - book：书籍
          - laws：法律条文
          - one：直接作为一个切片
        default: naive
        enum:
          - naive
          - qa
          - table
          - book
          - laws
          - one
      auto_keywords:
        type: integer
        format: int32
        description: 自动关键词提取
        default: 0
