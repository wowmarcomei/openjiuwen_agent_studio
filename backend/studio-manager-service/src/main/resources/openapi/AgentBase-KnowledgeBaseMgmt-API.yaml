        type: string
        description: 知识库图标
        minLength: 0
        maxLength: 1024000
      rag_chunk_parser_conf:
        description: 自研RAG知识库拆分配置
        $ref: '#/definitions/RagChunkParserConf'
  ModelConf:
    type: object
    description: 创建知识库关联模型信息
    properties:
      id:
        type: string
        example: 114
        description: 模型id
        maxLength: 64
        minLength: 0
      name:
        type: string
        example: agentBuilder_vector
        description: 模型名
        maxLength: 32
        minLength: 1
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9-_]{0,31}$
    required:
      - name
  ParseConf:
    type: object
    description: 文件解析配置-参数配置，包含是否使用OCR增强、是否解析图片、解析图片是否需要提取文字、是否解析页眉页脚、是否解析目录页等
    properties:
      ocr_enabled:
        type: boolean
        example: ''
        description: 是否开启ocr增强
        default: false
      image_enabled:
        type: boolean
        description: 是否开启图片增强
        default: false
      header_footer_enabled:
        type: boolean
        description: 是否解析页眉页脚
        default: false
      catalog_enabled:
        type: boolean
        description: 是否解析目录页
      image_conf:
        type: string
        description: 图片解析开启后（TEXT 提取图片文本、IMAGE 保留原图）
        enum:
          - TEXT
          - IMAGE
  SplitConf:
    type: object
    description: 文本分片配置。包括分段方式设置、层级解析模式设置、标题层级深度设置、标题保存方式设置、分段长度配置、标题匹配pattern配置等。
    properties:
      split_mode:
        type: string
        example: ''
        description: |-
          分段设置/层级解析模型
          - LENGTH-长度拆分，即为字数拆分
          - CATALOG-层级分段下的自动解析
          - RULE- 层级分段下的规则解析
          - AUTO- 自动拆分，自动识别文档格式匹配适合的拆分解析方式
        default: AUTO
        enum:
          - LENGTH
          - CATALOG
          - RULE
          - AUTO
      separator_ids:
        type: array
        description: |-
          分段标识符ID列表

          文件解析分类
          default.separator.list[0].id=space_en
          default.separator.list[0].separator=\u0020
          default.separator.list[0].locale=en

          default.separator.list[1].id=period_zh
          default.separator.list[1].separator=。
          default.separator.list[1].locale=zh

          default.separator.list[2].id=period_en
          default.separator.list[2].separator=.
          default.separator.list[2].locale=en

          default.separator.list[3].id=exclamation_mark_zh
          default.separator.list[3].separator=！
          default.separator.list[3].locale=zh

          default.separator.list[4].id=exclamation_mark_en
          default.separator.list[4].separator=!
          default.separator.list[4].locale=en

          default.separator.list[5].id=question_mark_zh
          default.separator.list[5].separator=？
          default.separator.list[5].locale=zh

          default.separator.list[6].id=question_mark_en
          default.separator.list[6].separator=?
          default.separator.list[6].locale=en

          default.separator.list[7].id=comma_zh
          default.separator.list[7].separator=，
          default.separator.list[7].locale=zh

          default.separator.list[8].id=comma_en
          default.separator.list[8].separator=,
          default.separator.list[8].locale=en
        default: ','
        minItems: 1
        maxItems: 100
        items:
          minLength: 1
          maxLength: 128
          type: string
      rule_regex_id:
        type: string
        description: 用户定义解析规则ID
        minLength: 1
        maxLength: 256
      chunk_size:
        type: integer
        format: int32
        description: 分段预计长度
        default: 500
        minimum: 0
        maximum: 6000
      title_level:
        type: integer
        format: int32
        description: 标题层级深度
        default: '3'
        minimum: 1
        maximum: 10
      combine_title:
        type: boolean
        description: |-
          false 保留最后一级
          true 保存多标题组合
      merge_titles:
        type: boolean
        description: 是否跨标题合并，不同标题段落文字较少时，会自动合并到指定的分段长度，有助于生成更全面的结果
  RagChunkParserConf:
