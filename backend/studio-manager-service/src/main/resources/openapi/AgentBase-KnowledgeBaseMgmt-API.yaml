        type: integer
        format: int32
        description: 建议文本块大小
        default: 512
        minimum: 1
        maximum: 2048
      delimiter:
        type: array
        description: |-
          分段标识符ID列表：支持中文句号、英文句号、中文感叹号、英文感叹号、中文问号、英文问号、中文逗号、英文逗号、空格、换行
        default: '/n'
        minItems: 1
        maxItems: 100
        items:
          minLength: 1
          maxLength: 128
          type: string
