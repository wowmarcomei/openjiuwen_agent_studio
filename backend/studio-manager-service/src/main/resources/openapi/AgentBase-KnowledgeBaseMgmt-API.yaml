definitions:
  ListKnowledgeBaseConfigsResponse:
    type: object
    description: 知识库配置响应体
    properties:
      configs:
        type: array
        description: 配置列表
        minItems: 0
        maxItems: 200
        items:
          $ref: '#/definitions/KnowledgeBaseConfig'
  KnowledgeBaseConfig:
    type: object
    description: 知识库配置
    properties:
      key:
        type: string
        description: 配置项key
        example: file_size
      value:
        type: object
        description: 配置项value
  QueryKnowledgeBaseResourceUsageResponse:
    type: object
    description: 查询知识库资源使用返回体
    properties:
      max_value:
        type: integer
        format: int64
        description: 资源限制总量
      used_value:
        type: integer
        format: int64
        description: 资源使用量
  ErrorRsp:
    type: object
    description: 完整错误信息
    properties:
      error_code:
        type: string
        description: 错误码
      error_msg:
        type: string
        description: 错误信息
      details:
        type: array
        items:
          $ref: '#/definitions/ErrorDetail'
        description: 调用接口返回的错误信息
      error_reason:
        type: string
        description: 错误原因
      error_suggestion:
        type: string
        description: 错误建议
  ErrorDetail:
    type: object
    description: 错误信息
    properties:
      error_code:
        type: string
        description: 错误码
      error_msg:
        type: string
        description: 错误信息
  SearchKnowledgeRepoRequestBody:
    type: object
    description: 知识命中测试请求体
    required:
      - knowledge_repo_id
      - query
      - search_mode
    properties:
      knowledge_repo_id:
        type: string
        description: 知识库ID
        maxLength: 64
        example: 3c941752-22ea-4eab-8011-63a1ce1c9840
        pattern: ^[a-zA-Z0-9_-]+$
      query:
        type: string
        description: 知识库命中测试输入
        maxLength: 4096
        minLength: 1
      search_mode:
        type: string
        description: |-
          检索策略模式，有4种取值：
          - doc，语义检索
          - keyword，关键词检索
          - mix，混合检索
          - faq，FAQ检索
        default: doc
        minLength: 1
        maxLength: 16
        enum:
          - doc
          - keyword
          - mix
          - faq
  SearchKnowledgeRepoResponseBody:
    type: object
    description: 知识命中测试响应体
    required:
      - total
    properties:
      total:
        type: integer
        format: int32
        description: 命中结果总数
        minimum: 0
        maximum: 65535
      search_result_list:
        type: array
        minItems: 0
        maxItems: 1000
        description: 命中文档列表
        items:
          $ref: '#/definitions/ChatReferenceInfo'
  ChatReferenceInfo:
    type: object
    description: 文档信息
    properties:
      file_id:
        type: string
        description: 文件id（或FAQ id）
        minLength: 1
        maxLength: 64
      chunk_id:
        type: string
        description: 分片id
        example: 032b44cf-fb49-4c6a-a1ee-944f463955ce
        pattern: ^[a-zA-Z0-9_-]+$
        minLength: 1
        maxLength: 64
      title:
        type: string
        description: 标题
        minLength: 1
        maxLength: 65535
      content:
        type: string
        description: 文本内容
        minLength: 1
        maxLength: 65535
      update_date_time:
        type: string
        description: 更新时间
        minLength: 1
        maxLength: 64
      doc_type:
        type: string
        description: 文档类型（doc-文档，faq-问答）
        minLength: 1
        maxLength: 64
      file_path:
        type: string
        description: 文档归档路径
        minLength: 1
        maxLength: 64
      category:
        type: string
        description: 文档目录，单值，对应目录树中的叶子节点
        example: 专利（3166-1）
        minLength: 4
        maxLength: 255
      tags:
        type: array
        description: 文档标签列表
        minItems: 0
        maxItems: 250
        items:
          example: 作者:刘震云
          minLength: 4
          maxLength: 255
          type: string
      score:
        type: number
        format: float
        description: ES打分
        minimum: 0
        maximum: 10000
      subtitle:
        type: string
        description: 文档子标题
        maxLength: 65535
        minLength: 1
      repo_id:
        type: string
        description: 知识库标识
        example: a4497368-a9f5-4461-8865-a2a21b1fb641
        minLength: 1
        maxLength: 64
      image_ids:
        type: array
        description: 切片中图片的id列表
        minItems: 0
        maxItems: 100
        items:
          type: string
          description: 图片ID
          minLength: 1
          maxLength: 100
      image_paths:
        type: array
        description: 切片中图片的访问路径列表
        minItems: 0
        maxItems: 100
        items:
          type: string
          description: 图片的访问路径
          minLength: 1
          maxLength: 2000
  KnowledgeSearchRecordRsp:
    type: object
    description: 知识库命中测试记录
    required:
      - count
      - KnowledgeSearchRecord
    properties:
      count:
        type: integer
        format: int64
        description: 命中测试记录数量
        example: 3c941752-22ea-4eab-8011-63a1ce1c9840
        pattern: ^[a-zA-Z0-9_-]+$
      KnowledgeSearchRecord:
        type: array
        items:
          $ref: '#/definitions/KnowledgeSearchRecord'
        description: 知识库测试记录列表
  KnowledgeSearchRecord:
    type: object
    description: 知识库命中测试记录
    required:
      - id
      - query
      - create_time
    properties:
      id:
        type: string
        description: 记录ID
        maxLength: 64
        example: 3c941752-22ea-4eab-8011-63a1ce1c9840
        pattern: ^[a-zA-Z0-9_-]+$
      query:
        type: string
        description: 测试输入
        maxLength: 65535
        minLength: 1
      create_time:
        type: integer
        format: int64
        description: 命中测试时的时间戳（毫秒级）
        example: 1768448005000
  ListKnowledgeModelsResponseBody:
    type: object
    description: 查询模型列表响应体
    properties:
      total:
        type: integer
        format: int32
        example: 22
        description: 总计
        minimum: 0
        maximum: 10000
      models:
        type: array
        description: 模型列表
        minItems: 0
        maxItems: 200
        items:
          $ref: '#/definitions/ModelInfo'
  ModelInfo:
    type: object
    description: 模型信息
    properties:
      name:
        type: string
        example: agentBuilder_vector
        description: 模型名
        maxLength: 32
        minLength: 1
      id:
        type: string
        example: 114
        description: 模型id
        maxLength: 64
        minLength: 0
      type:
        type: string
        description: 模型类型，embedding、rerank
        example: embedding
        minLength: 1
        maxLength: 64
        pattern: ^.*$
      status:
        type: string
        description: 模型状态，ready、error
        example: ready
        minLength: 1
        maxLength: 16
  CreateKnowledgeRepoRequestBody:
    type: object
    description: 创建知识库请求体
    required:
      - display_name
      - description
      - type
    properties:
      display_name:
        type: string
        description: 知识库展示名称
        example: 发票报销流程知识库
        maxLength: 50
        minLength: 1
        x-imports:
          - 'com.openjiuwen.studio.agent.annotation.common.ValidKnowledgeBaseName'
        x-annotations:
          - '@ValidKnowledgeBaseName'
      description:
        type: string
        example: 发票报销流程文档知识库，需要检索发票报销流程相关知识时使用
        description: 知识库的描述，尽可能的准确简短描述知识库的用途。
        minLength: 0
        maxLength: 100
      embedding_model:
        description: 向量模型信息
        $ref: '#/definitions/ModelConf'
      rerank_model:
        description: 精排模型信息
        $ref: '#/definitions/ModelConf'
      parse_conf:
        description: 知识库解析配置
        $ref: '#/definitions/ParseConf'
      split_conf:
        description: 知识库拆分配置
        $ref: '#/definitions/SplitConf'
