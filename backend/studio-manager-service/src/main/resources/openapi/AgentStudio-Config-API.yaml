definitions:
  ErrorRsp:
    type: object
    description: 完整错误信息
    properties:
      error_code:
        type: string
        description: 错误码
      error_msg:
        type: string
        description: 错误信息
      details:
        type: array
        items:
          $ref: '#/definitions/ErrorDetail'
        description: 调用接口返回的错误信息
      error_reason:
        type: string
        description: 错误原因
      error_suggestion:
        type: string
        description: 错误建议
  ErrorDetail:
    type: object
    description: 错误信息
    properties:
      error_code:
        type: string
        description: 错误码
      error_msg:
        type: string
        description: 错误信息
  ImportListInfo:
    type: object
    description: 文件解析内容
    properties:
      id:
        type: string
        description: id
      name:
        type: string
        description: 名称
      type:
        type: string
        description: 类型
      description:
        type: string
        description: 描述
      status:
        type: boolean
        description: 是否已存在
        default: false
      prohibited:
        type: boolean
        description: 不允许导入
        default: false
      dependencies:
        type: array
        items:
          $ref: '#/definitions/ImportListInfo'
  ComplexIntentInfoReq:
    type: object
    description: 意图包信息定义
    required:
      - name
    properties:
      name:
        type: string
        description: 意图包名称
        example: null
        maxLength: 64
        pattern: ^[\u4e00-\u9fa5a-zA-Z0-9\-_]+$
