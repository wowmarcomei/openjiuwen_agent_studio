definitions:
  McpServiceModifyReq:
    type: object
    description: 已部署的mcp服务变更
    properties:
      id:
        type: string
        description: 服务id
        maxLength: 64
        pattern: ^[a-zA-Z0-9-]+$
      name:
        type: string
        description: mcp 服务名称
        pattern: ^(?!_)(?!-)(?!\d)[a-zA-Z0-9_\-\u4e00-\u9fa5()（）\s.]{2,64}$
      name_en:
        type: string
        description: mcp服务英文名称
        pattern: ^[a-zA-Z0-9\s.,!?;:'"()_（）-]{2,64}$
      description:
        type: string
        description: mcp 服务描述
        minLength: 1
        maxLength: 1024
      description_en:
        type: string
        description: mcp 服务英文描述
        minLength: 1
        maxLength: 2048
      icon:
        type: string
        description: 图标
      server_config:
        type: string
        description: MCP安装配置
        pattern: ^[\u4e00-\u9fa5_a-zA-Z0-9\-,.?:;"'：=；“”‘’//，。？、()（）\[\]{}/@!！*%# \s]*$
      readme:
        type: string
        description: 概述 Markdown
      auth_info:
        description: 工具鉴权信息，无需鉴权、用户级鉴权、服务级鉴权
        $ref: '#/definitions/AuthInfo'

  McpServerRatingReq:
    type: object
    description:
    properties:
      server_id:
        type: string
        description: id
        pattern: ^[a-zA-Z0-9_-]+$
        maxLength: 64
      score:
        type: string
        description: id
        maxLength: 2

  LtsLogsResp:
    type: object
    description:
    properties:
      count:
        type: integer
        format: int32
      isQueryComplete:
        type: boolean
      logs:
        type: array
        items:
          $ref: '#/definitions/LogContents'
      analysisLogs:
        type: array
        items:
          type: object
  LogContents:
    type: object
    description:
    properties:
      content:
        type: string
      line_num:
        type: string
      createTime:
        type: string
      labels:
        type: object
        additionalProperties:
          type: string
  ListLogReq:
    type: object
    description:
    properties:
      startTime:
        type: string
      endTime:
        type: string
      keywords:
        type: string
        maxLength: 128
      limit:
        type: string
        maxLength: 3

      lineNum:
        type: string
        maxLength: 32
      searchType:
        type: string
  CesMetricDataResp:
    type: object
    description:
    properties:
      metric_name:
        type: string
      max:
        type: number
        format: double
      min:
        type: number
        format: double
      datapoints:
        type: array
        items:
          $ref: '#/definitions/Datapoints'

  Datapoints:
    type: object
    description:
    properties:
      unit:
        type: string
      average:
        type: number
        format: double
      max:
        type: number
        format: double
      min:
        type: number
        format: double
      sum:
        type: number
        format: double
      variance:
        type: number
        format: double
      timestamp:
        type: integer
        format: int64

  IdListRequest:
    type: object
    description:
    properties:
      ids:
        type: array
        x-maxLength: 1000
        x-type: List<@Size(min=0, max=255) String>
        items:
          type: string
  McpServiceStatisticResp:
    type: object
    description:
    properties:
      serviceId:
        type: string
        description: id
        maxLength: 64
      totalInvokingTimes:
        type: number
        format: double
      totalInvokingTimesPerMonth:
        type: number
        format: double
      totalInvokingTimesCurrentDay:
        type: number
        format: double
      totalInvokingTimesCurrentWeek:
        type: number
        format: double
  McpSearchCriteria:
    type: object
    description: 搜索条件
    properties:
      workspace_id:
        type: string
        description: 空间ID
        pattern: ^[a-zA-Z0-9_-]+$
        maxLength: 64
      id:
        type: string
        description: id
        pattern: ^[a-zA-Z0-9_-]+$
        maxLength: 64
      ids:
        type: array
        description: ids
        items:
          type: string
      name:
        type: string
        description: 名称
        maxLength: 64
      tool_chinese_name:
